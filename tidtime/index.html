<!doctype html>
<html lang="th">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; connect-src 'none'; object-src 'none'; base-uri 'none'"
    />
    <title>ติดทาม · ตรวจแปลงป่าไม้</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <header>
      <strong>ติดทาม <small>v0.1.1</small></strong>
      <nav>
        <button id="newJob">นำเข้า Excel</button
        ><button id="archive">งานที่บันทึก</button>
      </nav>
    </header>
    <main>
      <p id="message" role="status"></p>
      <section id="importer">
        <h1>เปรียบเทียบรอบสำรวจ</h1>
        <p>เลือกไฟล์และชีตของแปลงเดียวกัน ข้อมูลเก็บบนเครื่องนี้</p>
        <div class="pair" id="slots"></div>
        <button class="primary" id="create" disabled>เริ่มเปรียบเทียบ</button>
      </section>
      <section id="library" hidden>
        <h1>งานที่บันทึก</h1>
        <div id="jobs"></div>
      </section>
      <section id="work" hidden>
        <h1 id="heading"></h1>
        <p id="rounds"></p>
        <div class="workspace">
          <aside>
            <label
              ><input id="filter" type="checkbox" /> เฉพาะรายการที่ต้องตรวจ</label
            >
            <p id="count"></p>
            <div id="points"></div>
          </aside>
          <article id="detail"></article>
        </div>
      </section>
    </main>
    <script src="renderer.js"></script>
  </body>
</html>
